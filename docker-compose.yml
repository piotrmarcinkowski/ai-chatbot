services:
  ai-chatbot:
    image: ${BACKEND_IMAGE}
    build:
      context: ./app
      dockerfile: Dockerfile
      target: ${BACKEND_BUILD_TARGET}
    ports:
      - "${LANGGRAPH_API_PORT}:8000"
    depends_on:
      mongodb:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/ok"]
      interval: 30s
      timeout: 10s
      retries: 3
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - path: ${ENV_FILE}
        required: true
    volumes:
      - /etc/localtime:/etc/localtime:ro
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/${MONGO_DB}
      - REDIS_URI=${REDIS_URI}
      - DATABASE_URI=${DATABASE_URI}
      - LANGGRAPH_API_HOST=${LANGGRAPH_API_HOST}
      - LANGGRAPH_API_PORT=${LANGGRAPH_API_PORT}
    networks:
      - app_network
    profiles: ["dev", "devcontainer", "prod"]

  mongodb:
    image: mongo:8.0.6
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    networks:
      - app_network
    profiles: ["dev", "devcontainer", "prod"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: langgraph
      POSTGRES_USER: langgraph
      POSTGRES_PASSWORD: langgraph
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langgraph"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network
    profiles: ["prod"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - app_network
    profiles: ["prod"]

networks:
  app_network:
    name: ${COMPOSE_PROJECT_NAME}_network
    driver: bridge

volumes:
  mongodb-data:
    name: ${COMPOSE_PROJECT_NAME}_mongodb_data
  postgres-data:
    name: ${COMPOSE_PROJECT_NAME}_postgres_data
  redis-data:
    name: ${COMPOSE_PROJECT_NAME}_redis_data