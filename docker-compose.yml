name: ai-chatbot-dev

include:
  - persistence/mongodb/docker-compose-dev.yml

services:
  ai-chatbot:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: ai-chatbot-dev
    ports:
      - "8123:8123" # LangGraph server port (default for 'langgraph up')
    depends_on:
      - ai-chatbot-mongodb-dev
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8123/ok"]
      interval: 30s
      timeout: 10s
      retries: 3
    user: "${UID}:${GID}"
    env_file:
      - path: .env
        required: false
    volumes:
      - /etc/localtime:/etc/localtime:ro
    environment:
      # MongoDB for custom checkpointer
      - MONGODB_URI=mongodb://ai-chatbot-mongodb-dev:27017