# Production docker-compose using langgraph build
# 
# SETUP:
# 1. Build the production image first:
#    cd app/src && langgraph build -t ai-chatbot-prod:latest
# 
# 2. Run this compose file:
#    docker compose -f docker-compose.prod.yml up
#
include:
  - persistence/mongodb/docker-compose-prod.yml
  - persistence/postgresql/docker-compose.yml
  - persistence/redis/docker-compose.yml

services:
  ai-chatbot:
    # Use pre-built image from 'langgraph build' instead of building
    image: ai-chatbot-prod:latest
    ports:
      - "8124:8000" # LangGraph server port (production server uses 8000 internally)
    depends_on:
      ai-chatbot-postgres:
        condition: service_healthy
      ai-chatbot-redis:
        condition: service_healthy
      ai-chatbot-mongodb:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8124/ok"]
      interval: 30s
      timeout: 10s
      retries: 3
    env_file:
      - path: .env
        required: false
    volumes:
      - /etc/localtime:/etc/localtime:ro
    environment:
      # Redis for LangGraph server's task queue (required)
      - REDIS_URI=redis://ai-chatbot-redis:6379
      # PostgreSQL for LangGraph server's internal persistence (required)
      - DATABASE_URI=postgresql://langgraph:langgraph@ai-chatbot-postgres:5432/langgraph
      # MongoDB for your custom checkpointer (used in your code)
      - MONGODB_URI=mongodb://ai-chatbot-mongodb:27018
